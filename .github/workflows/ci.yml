name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '24'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: applications/mission-control-fe/package-lock.json
      - name: Backend tests
        run: mvn test
      - name: Frontend install
        working-directory: applications/mission-control-fe
        run: npm ci
      - name: Frontend tests
        working-directory: applications/mission-control-fe
        run: npm test -- --watch=false
      - name: Frontend production build
        working-directory: applications/mission-control-fe
        run: npm run build
      - name: Launcher syntax
        run: bash -n mc
