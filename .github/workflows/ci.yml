name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '24'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: applications/mission-control-fe/package-lock.json
      - name: Backend tests
        working-directory: applications/mission-control-server
        run: mvn test
      - name: Backend coverage summary
        # jacoco's report goal is bound to `test`, so the CSV already exists. Columns are
        # LINE_MISSED ($8) and LINE_COVERED ($9); $4/$5 are instructions, not lines.
        run: |
          awk -F, 'NR>1 {m+=$8; c+=$9} END {printf "backend line coverage: %.1f%% (%d/%d)\n", 100*c/(c+m), c, c+m}' \
            applications/mission-control-server/target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"
      - name: Backend coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: applications/mission-control-server/target/site/jacoco/
      - name: Frontend install
        working-directory: applications/mission-control-fe
        run: npm ci
      - name: Frontend lint
        working-directory: applications/mission-control-fe
        run: npm run lint
      - name: Frontend tests
        # also republishes api-contract.txt, which the backend's RouteContractTest reads. On CI
        # a drifted file fails the snapshot instead of being rewritten, so a route renamed on one
        # side and not the other cannot reach main.
        working-directory: applications/mission-control-fe
        run: npm run test:coverage
      - name: Frontend coverage summary
        # the vitest v8 provider writes coverage-summary.json alongside the html report;
        # `lines` is the metric the backend summary above reports, so the two are comparable.
        working-directory: applications/mission-control-fe
        run: |
          node -e '
            const { lines } = require("./coverage/mission-control/coverage-summary.json").total;
            console.log(`frontend line coverage: ${lines.pct}% (${lines.covered}/${lines.total})`);
          ' >> "$GITHUB_STEP_SUMMARY"
      - name: Frontend coverage report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: applications/mission-control-fe/coverage/mission-control/
      - name: Frontend production build
        working-directory: applications/mission-control-fe
        run: npm run build
      - name: Launcher syntax
        run: bash -n mc
      - name: Launcher lint
        # `bash -n` parses; it does not read. ./mc is the operator entrypoint — it mounts the
        # docker socket, mints and persists MC_SECRET_KEY, and picks the deploy flavor — and it
        # was the one component with no check beyond "does it tokenise". Warning severity and
        # above, so this gates on things that actually misbehave (unquoted expansions, unused
        # or misspelled variables, subshell state that does not survive) rather than on style.
        run: shellcheck -S warning mc

  # Everything above substitutes the Docker CLI, which pins the argv Mission Control builds but
  # never asks the daemon whether it accepts it. This job is the only thing that can tell, so it
  # runs the docker-tagged tests against the runner's own daemon. Coverage is switched off: this
  # executes one test class, so the ratchet would fail a run that is not measuring anything.
  docker-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '24'
          cache: maven
      - name: Managed MCP lifecycle against a real daemon
        working-directory: applications/mission-control-server
        run: mvn -B test -Dgroups=docker -Dsurefire.excludedGroups= -Djacoco.skip=true

  # The unit suites stub every store and exclude templates from coverage, so a page that
  # renders NaN, opens the browser's confirm() or drifts from the header convention passes
  # them all. This job serves the production build from the real jar against the runner's
  # own daemon — the same shape the Dockerfile ships — and walks every route the way an
  # operator would: no console error, no failed request, no overflow, and the crumb
  # vocabulary from docs/mission_control_guidelines.md. The daemon holds no Hermes
  # container, so every page is exercised in its empty state. Nothing is deployed.
  route-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '24'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: applications/mission-control-fe/package-lock.json
      - name: Frontend build
        working-directory: applications/mission-control-fe
        run: npm ci && npm run build
      - name: Bundle the frontend into the jar, as the Dockerfile does
        run: |
          cp -r applications/mission-control-fe/dist/mission-control/browser applications/mission-control-server/src/main/resources/static
          rm -f applications/mission-control-server/src/main/resources/static/config.js
      - name: Package
        working-directory: applications/mission-control-server
        run: mvn -q -B package -DskipTests -Djacoco.skip=true
      - name: Start
        working-directory: applications/mission-control-server
        env:
          MC_ALLOW_DEV_KEY: 'true'
          MC_STARTUP_RECONCILE: 'false'
          MC_REGISTRY_TAGS: 'false'
          MC_DB_PATH: /tmp/smoke.db
          MC_MCP_STACK_DIR: /tmp/mcp-stacks
        run: |
          java -jar target/mission-control-server-*.jar > /tmp/mc.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS localhost:8080/health && break; sleep 2; done
          curl -fsS localhost:8080/health
      - name: Browser
        working-directory: applications/mission-control-fe
        run: npx playwright install --with-deps chromium
      - name: Route smoke
        working-directory: applications/mission-control-fe
        env:
          BASE: http://localhost:8080
        run: npm run e2e:smoke
      - name: Server log
        if: failure()
        run: tail -100 /tmp/mc.log
