# Mission Control behind tailscale — reachable only from the tailnet.
#
# The mission-control container shares the tailscale container's network
# namespace (network_mode: service:tailscale), so NO host ports are published:
# the dashboard is invisible to the LAN and the internet. Tailscale serve
# forwards tailnet TCP :80 to the app on 127.0.0.1:8080.
#
# An optional ollama service (profile "ollama") provides a local model runtime.
# It is opt-in: './mc start' leaves it alone, './mc start --ollama=on' or
# './mc ollama up' deploys it, './mc ollama down' removes it. Unlike the
# dashboard it DOES publish a host port (default 11434, override with
# OLLAMA_PORT): Hermes agent containers run on the host daemon outside this
# stack and reach it via http://host.docker.internal:11434 (on Linux hosts that
# name needs --add-host=host.docker.internal:host-gateway, so prefer the host's
# bridge/LAN ip there). It is independent of tailscale so the plain flavor
# ('./mc start --ts=off') can run it too.
#
# Usage (via the repo-root manager script — this flavor is the default):
#   cp .env.example .env       # fill in TS_AUTHKEY
#   ./mc start --build         # build hermes-mission-control:latest + compose up -d
#   ./mc status                # tailscale health + the exact URL
#   ./mc ollama pull llama3.2  # manage models in the ollama service
#   open http://mission-control.<tailnet>.ts.net

services:
  tailscale:
    image: tailscale/tailscale:latest
    hostname: mission-control            # becomes the MagicDNS name
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?set in .env}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "false"              # kernel networking via /dev/net/tun
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
    devices:
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "tailscale", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  mission-control:
    image: hermes-mission-control:latest
    network_mode: "service:tailscale"    # shares the tailscale netns — no published ports
    depends_on:
      tailscale:
        condition: service_healthy
    environment:
      MC_CONTAINER_FILTER: hermes
      MC_SECRET_KEY: ${MC_SECRET_KEY:?set by ./mc}
      MC_SECRET_KEY_PREVIOUS: ${MC_SECRET_KEY_PREVIOUS:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - mission-control-data:/data
    # Bound the blast radius of a runaway (e.g. leaked terminal exec threads):
    # cpus caps CPU, mem_limit pairs with -XX:MaxRAMPercentage=50 (~256m heap),
    # and pids_limit turns a thread leak into a contained failure instead of a
    # host-starving spin. cgroup-level — unaffected by the shared tailscale netns.
    #
    # 512m, down from 1g: measured live, this process holds ~41 MB of heap and
    # ~98 MB of non-heap under a dashboard and five open stats streams, for
    # ~227 MiB resident. The heap ceiling is what the limit really buys, and at
    # 256m that is still six times what it has ever been seen to use. Raise both
    # this and the Dockerfile's percentage together — see the note beside it.
    cpus: "2.0"
    mem_limit: 512m
    pids_limit: 512
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]               # opt-in — './mc start' activates it
    ports:
      - "${OLLAMA_PORT:-11434}:11434"  # host port for agent containers outside the stack
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "--version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

volumes:
  tailscale-state:
  mission-control-data:
  ollama-models:
