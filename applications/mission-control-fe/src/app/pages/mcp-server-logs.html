<div class="scrim" (click)="closed.emit()">
  <div class="modal log-modal" (click)="$event.stopPropagation()">
    <div class="panel-h">
      LOGS — {{ server().name }}
      <span class="spacer"></span>
      @if (loading()) { <span class="chip info">polling</span> }
      <button class="btn sm ghost" (click)="closed.emit()">close</button>
    </div>
    <div class="log-body mono">
      @if (error()) {
        <p class="error">{{ error() }}</p>
      }
      @for (line of lines(); track line.ts + '-' + $index) {
        <div class="log-line">
          <span class="faint">{{ clock(line.ts) }}</span>
          <span [class]="'lvl-' + line.level">{{ line.level }}</span>
          <span class="source">{{ line.source }}</span>
          <span>{{ line.msg }}</span>
        </div>
      } @empty {
        <p class="faint">{{ loading() ? 'loading logs…' : 'No log lines returned.' }}</p>
      }
    </div>
  </div>
</div>
