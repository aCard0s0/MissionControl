<div class="scrim" (click)="closed.emit()">
  <div class="modal log-modal" (click)="$event.stopPropagation()">
    <div class="panel-h">
      LOGS — {{ server().name }}
      <span class="spacer"></span>
      @if (loading()) { <span class="chip info">polling</span> }
      <button class="btn sm ghost" (click)="closed.emit()">close</button>
    </div>
    <div class="log-body">
      <mc-log-view [lines]="lines()" [loading]="loading()" [error]="error()"
                   emptyText="No log lines returned."
                   heightKey="mc-log-mcp" />
    </div>
  </div>
</div>
