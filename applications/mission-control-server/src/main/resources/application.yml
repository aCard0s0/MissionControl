server:
  port: ${MC_PORT:8080}
  compression:
    # gzip large JSON responses — notably session chat history, which can reach
    # several MB for long conversations
    enabled: true
    mime-types: application/json,text/plain,text/html
    min-response-size: 1024

spring:
  application:
    name: mission-control-server
  datasource:
    url: jdbc:sqlite:${MC_DB_PATH:./data/mission-control.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite is a single-writer file database — one connection avoids lock contention
      maximum-pool-size: 1
  sql:
    init:
      mode: always

mc:
  startup-reconcile: ${MC_STARTUP_RECONCILE:true}
  api-base-url: ${MC_API_BASE_URL:}
  docker-socket: ${MC_DOCKER_SOCKET:unix:///var/run/docker.sock}
  hermes-image: ${MC_HERMES_IMAGE:nousresearch/hermes-agent}
  container-filter: ${MC_CONTAINER_FILTER:hermes}
  # Look up published image tags on Docker Hub so the dashboard can report a
  # version that has not been pulled yet. Turn off for air-gapped installs —
  # tag listing then falls back to the local image store.
  registry-tags: ${MC_REGISTRY_TAGS:true}
  # Generated, non-secret Compose definitions for the managed MCP project.
  # The combined image overrides this to its persisted /data volume.
  mcp-stack-dir: ${MC_MCP_STACK_DIR:./data/mcp-stacks}
  version: 0.1.0
  # AES key material for encrypting profile-template secrets at rest. Required: the
  # app fails to start when unset unless allow-dev-key is true (local dev only).
  secret-key: ${MC_SECRET_KEY:}
  # The prior secret-key value during a rotation — decryption falls back to it, so
  # secrets stay readable until each is re-saved (re-encrypted) under the new key.
  secret-key-previous: ${MC_SECRET_KEY_PREVIOUS:}
  # Opt-in to a built-in dev key when secret-key is unset. Keep false in production:
  # the dev key is in the source, so anything encrypted with it is publicly readable.
  allow-dev-key: ${MC_ALLOW_DEV_KEY:false}
  # terminal (/ws/terminal docker exec) session limits — bound runaway/abandoned
  # shells so their JVM-side reader/writer threads cannot accumulate
  terminal:
    max-sessions: ${MC_TERMINAL_MAX_SESSIONS:50}
    max-sessions-per-client: ${MC_TERMINAL_MAX_SESSIONS_PER_CLIENT:5}
    idle-timeout: ${MC_TERMINAL_IDLE_TIMEOUT:30m}
    session-max-lifetime: ${MC_TERMINAL_SESSION_MAX_LIFETIME:8h}
    heartbeat-interval: ${MC_TERMINAL_HEARTBEAT_INTERVAL:30s}
    pong-timeout: ${MC_TERMINAL_PONG_TIMEOUT:90s}
    # container user the web shell runs as; empty keeps the image default
    user: ${MC_TERMINAL_USER:hermes}
  # curated model catalog fallbacks, used when no live provider fetch is possible
  models:
    # Nous Portal is an OAuth account (hermes portal) — no key in the dashboard,
    # so the catalog is always this curated list (no live fetch).
    nous: ${MC_MODELS_NOUS:Hermes-4-405B,Hermes-4-70B,Hermes-4-14B}
    anthropic: ${MC_MODELS_ANTHROPIC:claude-fable-5,claude-opus-4-8,claude-sonnet-4-6,claude-haiku-4-5-20251001}
    openai: ${MC_MODELS_OPENAI:gpt-5.2,gpt-5.2-mini,gpt-5.1,gpt-4.1}
    # OpenRouter ids are provider/model — the live list (openrouter.ai/api/v1/models)
    # supersedes this when reachable.
    openrouter: ${MC_MODELS_OPENROUTER:nousresearch/hermes-4-405b,anthropic/claude-opus-4.7,anthropic/claude-sonnet-4,openai/gpt-5.2,google/gemini-2.5-pro,deepseek/deepseek-chat}

logging:
  level:
    com.github.dockerjava: WARN
